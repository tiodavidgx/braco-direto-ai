# Configuração Nginx - Braço Direito AI
# /etc/nginx/sites-available/braco-direto-ai

server {
    listen 80;
    server_name 72.60.244.138;  # Alterar para domínio quando tiver
    
    # Logs
    access_log /var/log/nginx/braco-direto-ai.access.log;
    error_log /var/log/nginx/braco-direto-ai.error.log;

    # Tamanho máximo de upload (para notas fiscais)
    client_max_body_size 50M;

    # Security headers (aplicados a todas as respostas)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Hide nginx version
    server_tokens off;

    # Frontend React (arquivos estáticos)
    root /var/www/braco-direto-ai/frontend/dist;
    index index.html;

    # SPA - redireciona todas as rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend Python (FastAPI)
    location /api/ {
        proxy_pass http://127.0.0.1:14001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Docs da API (bloqueadas em produção — backend já retorna 404 quando ENV=production)
    # Se quiser expor somente em rede interna, troque por `allow 10.0.0.0/8; deny all;`
    location /docs { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    # WhatsApp API (interno, apenas para o backend)
    location /whatsapp/ {
        proxy_pass http://127.0.0.1:14003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Arquivos de upload (notas fiscais, etc)
    location /uploads/ {
        alias /var/www/braco-direto-ai/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:14001/health;
        proxy_http_version 1.1;
    }

    # Arquivos estáticos com cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}

